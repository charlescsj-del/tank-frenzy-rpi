name: Tank Frenzy
version: "3.11.0"
slug: tank_frenzy
description: Multiplayer tank battles hosted on your Raspberry Pi
url: https://github.com/charlescsj-del/tank-frenzy-rpi
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
ingress: true
ingress_port: 8099
panel_icon: mdi:tank
panel_title: Tank Frenzy
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: Game access for LAN players (no Home Assistant login)
watchdog: http://[HOST]:[PORT:8765]/health
homeassistant_api: true
options:
  public_url: ""
  notify_service: ""
  rewards_enabled: true
  vehicle_classes_enabled: false
schema:
  public_url: str
  notify_service: str
  rewards_enabled: bool?
  vehicle_classes_enabled: bool?
  admin_password: password?
  admin_path: str?

