configuration:
  public_url:
    name: Public game address
    description: >-
      Address friends use on your network, for example http://192.168.1.50:8765.
      Used for Copy Invite and notification links. Leave empty to use the address open in the browser.
  notify_service:
    name: Notify service for new rooms
    description: >-
      Home Assistant notify service that announces newly opened rooms, for example
      notify.mobile_app_your_phone or notify.notify. At most one notification a minute.
      Leave empty to turn notifications off.
  admin_password:
    name: Admin password
    description: >-
      Required to open the admin page on the public game address (for example your Cloudflare link).
      At least 8 characters. Leave empty to keep the admin page off the public address; through the
      Home Assistant sidebar it opens without a password.
  admin_path:
    name: Admin page address
    description: >-
      Private address of the admin page, for example hq-7f3k to use /hq-7f3k. Nothing in the game
      links to it. Letters, digits, - and _ only. Leave empty for /admin.
network:
  8765/tcp: Game access for LAN players (no Home Assistant login)
